name: Build APK FCM (Veylo)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Dominio de la instancia, sin https
        required: true
        default: veylo.sbs
        type: string
      apk_url:
        description: URL HTTPS de descarga de la APK
        required: false
        type: string
      developer_docs_url:
        description: URL HTTPS de documentación para desarrolladores
        required: false
        type: string
      whats_new_url:
        description: URL HTTPS de Novedades
        required: false
        type: string
      terms_url:
        description: URL HTTPS de Términos
        required: false
        type: string
      privacy_url:
        description: URL HTTPS de Privacidad
        required: false
        type: string
      desktop_url:
        description: URL HTTPS de descarga de escritorio
        required: false
        type: string
      ios_url:
        description: URL HTTPS de descarga para iOS
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Aplicar personalización Premium del perfil
        run: |
          git apply --check patches/veylo-perfil-android.patch
          git -C dart_sdk apply --check ../patches/veylo-perfil-dart-sdk.patch
          git apply patches/veylo-perfil-android.patch
          git -C dart_sdk apply ../patches/veylo-perfil-dart-sdk.patch

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Cache de pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Configurar instancia y enlaces de Veylo
        env:
          DOMAIN: ${{ inputs.domain }}
          APK_URL: ${{ inputs.apk_url }}
          DEVELOPER_DOCS_URL: ${{ inputs.developer_docs_url }}
          WHATS_NEW_URL: ${{ inputs.whats_new_url }}
          TERMS_URL: ${{ inputs.terms_url }}
          PRIVACY_URL: ${{ inputs.privacy_url }}
          DESKTOP_URL: ${{ inputs.desktop_url }}
          IOS_URL: ${{ inputs.ios_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          domain = os.environ["DOMAIN"].strip().lower()
          label = r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?"
          if len(domain) > 253 or not re.fullmatch(rf"(?:{label}\.)+{label}", domain):
              raise SystemExit("Escribe solo el dominio, sin https:// ni rutas.")

          def url(name, default):
              value = os.environ.get(name, "").strip() or default
              parsed = urlsplit(value)
              if (
                  parsed.scheme != "https"
                  or not parsed.hostname
                  or parsed.username is not None
                  or any(c.isspace() or c in "'\"\\$`<>" for c in value)
              ):
                  raise SystemExit(f"Usa una URL HTTPS válida para {name}")
              return value

          home = f"https://{domain}"
          releases = "https://github.com/natie1515/Suy/releases"
          docs = url("DEVELOPER_DOCS_URL", f"https://docs.{domain}/")
          news = url("WHATS_NEW_URL", releases)
          terms = url("TERMS_URL", f"{home}/terms")
          privacy = url("PRIVACY_URL", f"{home}/privacy")
          desktop = url("DESKTOP_URL", f"{home}/")
          apk = url("APK_URL", f"{releases}/latest")
          ios = url("IOS_URL", f"{home}/")

          def replace_literal(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"No se encontró el ajuste esperado en {path}: {old}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          rules = [
              (r"https://play\.google\.com/store/apps/details\?id=com\.fluxer\b[^\s'\"<>)\\]*", apk),
              (r"https://apps\.apple\.com/(?:[a-z]{2}/)?app/(?:id6761338365|fluxer)(?:[/-][^\s'\"<>)\\]*)?", ios),
              (r"https://(?:www\.)?fluxer\.com/(?:terms(?:-of-service)?|tos)(?![\w-])[^\s'\"<>)\\]*", terms),
              (r"https://(?:www\.)?fluxer\.com/privacy(?:-policy)?(?![\w-])[^\s'\"<>)\\]*", privacy),
              (r"https://(?:www\.|docs\.)?fluxer\.com/downloads?(?![\w-])[^\s'\"<>)\\]*", desktop),
              (r"https://(?:docs\.fluxer\.com(?:/[^\s'\"<>)\\]*)?|(?:www\.)?fluxer\.com/developers?(?![\w-])[^\s'\"<>)\\]*)", docs),
          ]
          for path in sorted(Path("lib").rglob("*.dart")):
              if path.name.endswith((".g.dart", ".freezed.dart")):
                  continue
              source = path.read_text(encoding="utf-8")
              updated = source
              for pattern, destination in rules:
                  updated = re.sub(pattern, lambda _: destination, updated, flags=re.IGNORECASE)
              if updated != source:
                  path.write_text(updated, encoding="utf-8")

          constants = Path("lib/core/instance/instance_constants.dart")
          source = constants.read_text(encoding="utf-8")
          values = {
              "defaultApiBaseUrl": f"{home}/api/v1",
              "defaultGatewayUrl": f"wss://{domain}/gateway",
              "defaultInstanceInputUrl": domain,
              "defaultTermsUrl": terms,
              "defaultPrivacyUrl": privacy,
              "helpCenterUrl": f"{home}/help",
              "defaultProductName": "Veylo",
          }
          for key, value in values.items():
              source, count = re.subn(
                  rf"(\b{key}\s*=\s*)'[^']*'",
                  lambda match: f"{match[1]}'{value}'",
                  source,
              )
              if count != 1:
                  raise SystemExit(f"No se encontró un ajuste único: {key}")
          constants.write_text(source, encoding="utf-8")

          oauth = "lib/features/settings/utils/oauth_authorize_url.dart"
          replace_literal(oauth, "'https://fluxer.dev'", f"'{docs}'")
          replace_literal(oauth, "'fluxer.dev'", f"'{urlsplit(docs).hostname}'")
          replace_literal(
              "lib/core/constants/external_urls.dart",
              "'$fluxerMarketing/patch-notes'",
              f"'{news}'",
          )

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, count = re.subn(
              r'(manifestPlaceholders\["appLabel"\]\s*=\s*)"Fluxer"',
              r'\1"Veylo"',
              source,
          )
          if not count:
              raise SystemExit("No se encontró la etiqueta appLabel de Android.")
          gradle.write_text(source, encoding="utf-8")

          sheet = Path("lib/features/settings/presentation/sheets/account_delete_sheet.dart")
          source = sheet.read_text(encoding="utf-8")
          sheet.write_text(
              source.replace("https://play.google.com/store/account/subscriptions", home),
              encoding="utf-8",
          )

          for file in Path("lib/l10n").rglob("fluxer_es*.arb"):
              source = file.read_text(encoding="utf-8")
              updated = source.replace(
                  "Política de privacidad de la app Fluxer",
                  "Política de privacidad de la app Veylo",
              )
              if updated != source:
                  file.write_text(updated, encoding="utf-8")
          file = Path("lib/l10n/generated/fluxer_localizations_es.dart")
          if file.is_file():
              source = file.read_text(encoding="utf-8")
              file.write_text(source.replace(
                  "Política de privacidad de la app Fluxer",
                  "Política de privacidad de la app Veylo",
              ), encoding="utf-8")
          PY

      - name: Ajustar portada del perfil a 680 × 240
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/features/profile/presentation/widgets/user_profile_view.dart")
          source = path.read_text(encoding="utf-8")
          start = "    Widget scrollView = CustomScrollView("
          end = "      child: scrollView,\n    );"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit("No se encontró la sección de portada del perfil.")
          first = source.index(start)
          last = source.index(end, first) + len(end)
          layout = source[first:last]
          if layout.count("_kBannerHeight") != 5:
              raise SystemExit("Cambió el diseño de la portada en el código de Android.")
          layout = layout.replace("_kBannerHeight", "bannerHeight")
          body = "\n".join("    " + line if line else line for line in layout.splitlines())
          replacement = (
              "    return LayoutBuilder(\n"
              "      builder: (context, constraints) {\n"
              "        final bannerHeight = constraints.hasBoundedWidth\n"
              "            ? constraints.maxWidth * 240 / 680\n"
              "            : _kBannerHeight;\n"
              f"{body}\n"
              "      },\n"
              "    );"
          )
          path.write_text(source[:first] + replacement + source[last:], encoding="utf-8")
          PY

      - name: Mantener Omitir en el editor de avatar y mostrar la portada permitida
        run: |
          python3 - <<'PY'
          from pathlib import Path

          widgets = Path("lib/features/settings/presentation/widgets")

          def replace(name, old, new):
              file = widgets / name
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"Cambió el código esperado en {file}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          crop_import = "import 'package:fluxer_app/features/settings/presentation/widgets/image_crop_sheet.dart';"
          replace(
              "user_profile.dart",
              crop_import,
              "import 'package:fluxer_app/features/settings/presentation/widgets/image_crop_layout.dart';\n"
              + crop_import,
          )
          replace(
              "user_profile.dart",
              "    final croppedBytes = await showImageCropSheet(\n"
              "      context,\n      imageBytes: picked.bytes,\n"
              "      aspectRatio: isAvatar ? 1.0 : 17.0 / 6.0,\n"
              "      title: isAvatar\n"
              "          ? FluxerLocalizations.of(context).cropAvatar\n"
              "          : FluxerLocalizations.of(context).cropBanner,\n"
              "      maskShape: isAvatar ? CropMaskShape.circle : CropMaskShape.rectangle,\n"
              "    );",
              "    final editorBytes = isAvatar\n"
              "        ? await imageCropFitFullAvatar(picked.bytes)\n"
              "        : picked.bytes;\n"
              "    if (!mounted) return;\n"
              "    final croppedBytes = await showImageCropSheet(\n"
              "      context,\n"
              "      imageBytes: editorBytes,\n"
              "      aspectRatio: isAvatar ? 1.0 : 17.0 / 6.0,\n"
              "      title: isAvatar\n"
              "          ? (Localizations.localeOf(context).languageCode == 'es'\n"
              "                ? 'Editar imagen'\n"
              "                : 'Edit image')\n"
              "          : FluxerLocalizations.of(context).cropBanner,\n"
              "    );",
          )
          replace(
              "user_profile.dart",
              "    if (!state.isPremium) {",
              "    final canUploadBanner = ref.watch(\n"
              "      instanceFeatureEnabledProvider(LimitKeys.featureAnimatedBanner),\n"
              "    );\n"
              "    if (!state.isPremium && !canUploadBanner) {",
          )
          replace(
              "image_crop_layout.dart",
              "Future<Size?> imageCropDecodeImageSize(Uint8List bytes) {",
              """Future<Uint8List> imageCropFitFullAvatar(Uint8List bytes) {
            return compute(_fitFullAvatar, bytes);
          }

          Uint8List _fitFullAvatar(Uint8List bytes) {
            final decoded = img.decodeImage(bytes);
            if (decoded == null) return bytes;

            final source = img.bakeOrientation(decoded);
            const canvasSize = 512;
            const safeDiameter = 508;
            final diagonal = sqrt(
              source.width * source.width + source.height * source.height,
            );
            final scale = safeDiameter / diagonal;
            final fitted = img.copyResize(
              source,
              width: max(1, (source.width * scale).floor()),
              height: max(1, (source.height * scale).floor()),
              interpolation: img.Interpolation.average,
            );
            final canvas = img.Image(
              width: canvasSize,
              height: canvasSize,
              numChannels: 4,
            );
            img.compositeImage(
              canvas,
              fitted,
              dstX: (canvasSize - fitted.width) ~/ 2,
              dstY: (canvasSize - fitted.height) ~/ 2,
            );
            return img.encodePng(canvas);
          }

          Future<Size?> imageCropDecodeImageSize(Uint8List bytes) {""",
          )
          PY

      - name: Configurar Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(os.environ["FIREBASE_CONFIG"] or "null")
          if not config:
              raise SystemExit("Falta el secreto FIREBASE_GOOGLE_SERVICES_JSON.")

          client = next(
              (entry for entry in config.get("client", [])
               if entry.get("client_info", {}).get("android_client_info", {})
               .get("package_name") == "com.fluxer"),
              None,
          )
          if client is None:
              raise SystemExit("El JSON de Firebase debe incluir com.fluxer.")

          output = Path("android/app/src/stableFcm/google-services.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(config), encoding="utf-8")

          project = config["project_info"]
          fields = {
              "apiKey": next(
                  (item["current_key"] for item in client.get("api_key", [])
                   if item.get("current_key")),
                  None,
              ),
              "appId": client["client_info"].get("mobilesdk_app_id"),
              "messagingSenderId": project.get("project_number"),
              "projectId": project.get("project_id"),
          }
          if any(not isinstance(value, str) or not value for value in fields.values()):
              raise SystemExit("Faltan campos Android en google-services.json.")
          if project.get("storage_bucket"):
              fields["storageBucket"] = project["storage_bucket"]

          arguments = "".join(
              "    " + key + ": " + json.dumps(value).replace("$", r"\$") + ",\n"
              for key, value in fields.items()
          )
          options = Path("packages/fluxer_fcm/lib/firebase_options.dart")
          options.write_text(
              "import 'package:firebase_core/firebase_core.dart';\n\n"
              "class DefaultFirebaseOptions {\n"
              "  static const FirebaseOptions currentPlatform = FirebaseOptions(\n"
              + arguments
              + "  );\n}\n",
              encoding="utf-8",
          )

          relay = Path("lib/core/push/web_push/web_push_relay.dart")
          source = relay.read_text(encoding="utf-8")
          old = "const String kPushRelayOrigin = 'https://push.fluxer.com';"
          if source.count(old) != 1:
              raise SystemExit("No se encontró el relay FCM esperado.")
          domain = os.environ["DOMAIN"].strip().lower()
          relay.write_text(
              source.replace(old, f"const String kPushRelayOrigin = 'https://{domain}';", 1),
              encoding="utf-8",
          )
          PY
          dart tool/configure_build.dart --profile=android-fcm

      - name: Rust para Android
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets

      - name: Stub de unifiedpush_linux
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Dependencias
        run: flutter pub get

      - name: Generar código
        run: dart run build_runner build

      - name: Liberar disco y ajustar memoria
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if [[ -z "$(swapon --noheadings --show=NAME)" ]]; then
            swap_path="$(mktemp /var/tmp/veylo-swap.XXXXXX)"
            sudo fallocate -l 8G "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
          fi
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - name: Compilar APK arm64
        run: |
          test -s android/app/src/stableFcm/google-services.json
          flutter build apk --release \
            --target-platform android-arm64 \
            --flavor stableFcm \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define-from-file=tool/dart_defines/stable.json \
            --dart-define=PUSH_PROVIDER=firebase \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Se esperaba una APK release y se encontraron ${#apks[@]}." >&2
            exit 1
          fi
          cp "${apks[0]}" Veylo-FCM-arm64.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-Android-FCM-arm64
          path: Veylo-FCM-arm64.apk
          if-no-files-found: error

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          gh release create "veylo-fcm-$GITHUB_RUN_NUMBER" Veylo-FCM-arm64.apk \
            --title "Veylo APK #$GITHUB_RUN_NUMBER" \
            --notes "APK firmada con la clave debug. Dominio: $DOMAIN"
