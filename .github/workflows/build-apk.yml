name: Build APK (Veylo)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Dominio de tu instancia (sin https://)
        required: true
        default: bot1.hidenplay.net

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Cache de pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Configurar instancia y nombre
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          domain = os.environ["DOMAIN"].strip().lower()
          if len(domain) > 253 or not re.fullmatch(r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", domain):
              raise SystemExit("Escribe solo el dominio, sin https:// ni rutas.")

          constants = Path("lib/core/instance/instance_constants.dart")
          source = constants.read_text(encoding="utf-8")
          for key, value in {
              "defaultApiBaseUrl": f"https://{domain}/api/v1",
              "defaultGatewayUrl": f"wss://{domain}/gateway",
              "defaultInstanceInputUrl": domain,
              "defaultTermsUrl": f"https://{domain}/terms",
              "defaultPrivacyUrl": f"https://{domain}/privacy",
              "helpCenterUrl": f"https://{domain}/help",
              "defaultProductName": "Veylo",
          }.items():
              source, count = re.subn(rf"({key}\s*=\s*)'[^']*'", lambda match: f"{match[1]}'{value}'", source)
              if count != 1:
                  raise SystemExit(f"No se encontró un ajuste único: {key}")
          constants.write_text(source, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text(encoding="utf-8")
          source, count = re.subn(r'(manifestPlaceholders\["appLabel"\]\s*=\s*)"Fluxer"', r'\1"Veylo"', source)
          if count < 1:
              raise SystemExit("No se encontró la etiqueta appLabel de Android.")
          gradle.write_text(source, encoding="utf-8")

          sheet = Path("lib/features/settings/presentation/sheets/account_delete_sheet.dart")
          source = sheet.read_text(encoding="utf-8")
          sheet.write_text(source.replace("https://play.google.com/store/account/subscriptions", f"https://{domain}"), encoding="utf-8")
          PY

      - name: Ajustar portada del perfil a 680 × 240
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/features/profile/presentation/widgets/user_profile_view.dart")
          source = path.read_text(encoding="utf-8")
          start = "    Widget scrollView = CustomScrollView("
          end = "      child: scrollView,\n    );"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit("No se encontró la sección de portada del perfil.")
          first = source.index(start)
          last = source.index(end, first) + len(end)
          layout = source[first:last]
          if layout.count("_kBannerHeight") != 5:
              raise SystemExit("Cambió el diseño de la portada en el código de Android.")
          layout = layout.replace("_kBannerHeight", "bannerHeight")
          body = "\n".join("    " + line if line else line for line in layout.splitlines())
          replacement = (
              "    return LayoutBuilder(\n"
              "      builder: (context, constraints) {\n"
              "        final bannerHeight = constraints.hasBoundedWidth\n"
              "            ? constraints.maxWidth * 240 / 680\n"
              "            : _kBannerHeight;\n"
              f"{body}\n"
              "      },\n"
              "    );"
          )
          path.write_text(source[:first] + replacement + source[last:], encoding="utf-8")
          PY

      - name: Editar avatar con marco cuadrado y opción de foto completa
        run: |
          python3 - <<'PY'
          from pathlib import Path

          widgets = Path("lib/features/settings/presentation/widgets")

          def replace(file, old, new):
              path = widgets / file
              source = path.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"Cambió el código del editor en {path}")
              path.write_text(source.replace(old, new), encoding="utf-8")

          replace("user_profile.dart",
              "import 'package:fluxer_app/features/settings/presentation/widgets/image_crop_sheet.dart';",
              "import 'package:fluxer_app/features/settings/presentation/widgets/image_crop_layout.dart';\n"
              "import 'package:fluxer_app/features/settings/presentation/widgets/image_crop_sheet.dart';")
          replace("user_profile.dart",
              "    final croppedBytes = await showImageCropSheet(\n"
              "      context,\n      imageBytes: picked.bytes,\n"
              "      aspectRatio: isAvatar ? 1.0 : 17.0 / 6.0,\n"
              "      title: isAvatar\n"
              "          ? FluxerLocalizations.of(context).cropAvatar\n"
              "          : FluxerLocalizations.of(context).cropBanner,\n"
              "      maskShape: isAvatar ? CropMaskShape.circle : CropMaskShape.rectangle,\n"
              "    );",
              "    final editorBytes = isAvatar\n"
              "        ? await imageCropFitFullAvatar(picked.bytes)\n"
              "        : picked.bytes;\n"
              "    if (!mounted) return;\n"
              "    final croppedBytes = await showImageCropSheet(\n"
              "      context,\n"
              "      imageBytes: editorBytes,\n"
              "      aspectRatio: isAvatar ? 1.0 : 17.0 / 6.0,\n"
              "      title: isAvatar\n"
              "          ? (Localizations.localeOf(context).languageCode == 'es'\n"
              "                ? 'Editar imagen'\n"
              "                : 'Edit image')\n"
              "          : FluxerLocalizations.of(context).cropBanner,\n"
              "      skipLabel: isAvatar\n"
              "          ? (Localizations.localeOf(context).languageCode == 'es'\n"
              "                ? 'Usar foto completa'\n"
              "                : 'Use full photo')\n"
              "          : null,\n"
              "    );")

          replace("image_crop_layout.dart",
              "Future<Size?> imageCropDecodeImageSize(Uint8List bytes) {",
              """Future<Uint8List> imageCropFitFullAvatar(Uint8List bytes) {
            return compute(_fitFullAvatar, bytes);
          }

          Uint8List _fitFullAvatar(Uint8List bytes) {
            final decoded = img.decodeImage(bytes);
            if (decoded == null) return bytes;

            final source = img.bakeOrientation(decoded);
            const canvasSize = 512;
            const safeDiameter = 508;
            final diagonal = sqrt(
              source.width * source.width + source.height * source.height,
            );
            final scale = safeDiameter / diagonal;
            final fitted = img.copyResize(
              source,
              width: max(1, (source.width * scale).floor()),
              height: max(1, (source.height * scale).floor()),
              interpolation: img.Interpolation.average,
            );
            final canvas = img.Image(
              width: canvasSize,
              height: canvasSize,
              numChannels: 4,
            );
            img.compositeImage(
              canvas,
              fitted,
              dstX: (canvasSize - fitted.width) ~/ 2,
              dstY: (canvasSize - fitted.height) ~/ 2,
            );
            return img.encodePng(canvas);
          }

          Future<Size?> imageCropDecodeImageSize(Uint8List bytes) {""")
          PY

      - name: Configurar perfil OSS
        run: dart tool/configure_build.dart --profile=oss

      - name: Rust para Android
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets

      - name: Stub de unifiedpush_linux
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Dependencias
        run: flutter pub get

      - name: Generar código
        run: dart run build_runner build

      - name: Liberar disco y ajustar memoria
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          active_swap="$(swapon --noheadings --show=NAME)"
          if [[ -n "$active_swap" ]]; then
            echo "Se usará el swap activo del runner."
          else
            swap_path="$(mktemp /var/tmp/veylo-swap.XXXXXX)"
            sudo fallocate -l 8G "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
          fi
          free -h
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - name: Compilar APK arm64
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --flavor stableUnifiedpush \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define-from-file=tool/dart_defines/stable.json \
            --dart-define=PUSH_PROVIDER=unifiedpush \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Se esperaba un APK release, se encontraron ${#apks[@]}." >&2
            exit 1
          fi
          cp "${apks[0]}" Veylo-arm64.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Veylo-Android-arm64
          path: Veylo-arm64.apk
          if-no-files-found: error

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          gh release create "veylo-apk-$GITHUB_RUN_NUMBER" Veylo-arm64.apk \
            --title "Veylo APK #$GITHUB_RUN_NUMBER" \
            --notes "APK firmado con la clave debug. Dominio: $DOMAIN"
